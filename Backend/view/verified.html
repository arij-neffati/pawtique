<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Email Verification</title>
    <style>
        .container {
            text-align: center;
            padding: 50px 20px;
            font-family: Arial, sans-serif;
        }
        .success {
            color: #28a745;
            font-size: 24px;
            margin-bottom: 20px;
        }
        .error {
            color: #dc3545;
            font-size: 24px;
            margin-bottom: 20px;
        }
        .btn {
            padding: 10px 20px;
            background-color: #007bff;
            color: white;
            text-decoration: none;
            border-radius: 5px;
        }
    </style>
</head>
<body>
    <div class="container">
        <script>
            const urlParams = new URLSearchParams(window.location.search);
            const error = urlParams.get('error');
            const message = urlParams.get('message');
            
            if (error) {
                document.write(`<div class="error">${message || 'Verification Failed'}</div>`);
            } else {
                document.write('<div class="success">Email Verified Successfully!</div>');
            }
        </script>
        <a onclick="redirectToSignIn()" class="btn">Go to Sign In</a>

        <script>
            function redirectToSignIn() {
                const injector = window.getAngularInjector(); // Replace with a function to access Angular
                const router = injector.get('Router');
                router.navigate(['/signin']); // Adjust this to your Angular route for sign-in
            }
        </script>
    </div>
</body>
</html>
