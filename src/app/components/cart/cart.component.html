<div class="container py-5">
  <h4 class="d-flex justify-content-between align-items-center mb-3">
    <span class="text-primary">Your cart</span>
    <span class="badge bg-primary rounded-circle pt-2">{{ cartItems.length }}</span>
  </h4>
  <ul class="list-group mb-3">
    <li
      *ngFor="let item of cartItems"
      class="list-group-item d-flex justify-content-between lh-sm"
    >
      <div>
        <h6 class="my-0">{{ item.name }}</h6>
        <small class="text-body-secondary">{{ item.description }}</small>
      </div>
      <div class="text-end">
        <span class="text-body-secondary d-block">{{ item.price }} DT</span>
        <small class="text-body-secondary">Qty: {{ item.qty }}</small>
        <button
          class="btn btn-danger btn-sm mt-2"
          (click)="removeFromCart(item._id)"
        >
          Remove
        </button>
      </div>
    </li>
    <li class="list-group-item d-flex justify-content-between">
      <span class="fw-bold">Total (DT)</span>
      <strong>{{ totalPrice }} DT</strong>
    </li>
  </ul>

  <button
    class="w-100 btn btn-primary btn-lg"
    type="button"
    [disabled]="cartItems.length === 0"
    (click)="checkout()"
  >
    Continue to checkout
  </button>
</div>
