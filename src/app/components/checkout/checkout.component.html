<section id="checkout" style="background: url('../assets/images/background-img.png') no-repeat;">
  <div class="container">
    <div class="row my-5 py-5">
      <div class="offset-md-3 col-md-6 my-5">
        <h2 class="display-3 fw-normal text-center">Complete Your Order</h2>
        <h1 class="text-center"><span class="text-primary">Fill in your details below to complete the purchase</span></h1>
        <form #orderForm="ngForm" (ngSubmit)="handleOrderSubmit()">
          
          <!-- User ID Input -->
          <div class="mb-3">
            <input 
              type="text" 
              class="form-control form-control-lg" 
              name="userId" 
              [(ngModel)]="userId" 
              required
              placeholder="Enter your User ID">
          </div>

          <!-- Email Input -->
          <div class="mb-3">
            <input 
              type="email" 
              class="form-control form-control-lg" 
              name="email" 
              [(ngModel)]="email" 
              required
              placeholder="Enter your Email">
          </div>

          <!-- Shipping Address Inputs -->
          <div class="mb-3">
            <input 
              type="text" 
              class="form-control form-control-lg" 
              name="address" 
              [(ngModel)]="shippingAddress.address" 
              #addressInput="ngModel" 
              required
              placeholder="Enter your address">
            <div *ngIf="addressInput.invalid && (addressInput.dirty || addressInput.touched)" class="text-danger">
              Address is required.
            </div>
          </div>

          <div class="mb-3">
            <input 
              type="text" 
              class="form-control form-control-lg" 
              name="city" 
              [(ngModel)]="shippingAddress.city" 
              #cityInput="ngModel" 
              required
              placeholder="Enter your city">
            <div *ngIf="cityInput.invalid && (cityInput.dirty || cityInput.touched)" class="text-danger">
              City is required.
            </div>
          </div>

          <div class="mb-3">
            <input 
              type="text" 
              class="form-control form-control-lg" 
              name="postalCode" 
              [(ngModel)]="shippingAddress.postalCode" 
              #postalCodeInput="ngModel" 
              required
              placeholder="Enter your postal code">
            <div *ngIf="postalCodeInput.invalid && (postalCodeInput.dirty || postalCodeInput.touched)" class="text-danger">
              Postal code is required.
            </div>
          </div>

          <div class="mb-3">
            <input 
              type="text" 
              class="form-control form-control-lg" 
              name="country" 
              [(ngModel)]="shippingAddress.country" 
              #countryInput="ngModel" 
              required
              placeholder="Enter your country">
            <div *ngIf="countryInput.invalid && (countryInput.dirty || countryInput.touched)" class="text-danger">
              Country is required.
            </div>
          </div>

          <!-- Submit Button -->
          <div class="d-grid gap-2">
            <button 
              type="submit" 
              class="btn btn-dark btn-lg rounded-1"
              [disabled]="!orderForm.form.valid || isSubmitting">
              {{ isSubmitting ? 'Processing Order...' : 'Place Order' }}
            </button>
          </div>

          <!-- Error Message -->
          <div *ngIf="errorMessage" class="text-danger mt-3">
            {{ errorMessage }}
          </div>
        </form>
      </div>
    </div>
  </div>
</section>
