<div class="container py-5">
    <h4 class="d-flex justify-content-between align-items-center mb-3">
      <span class="text-primary">Shipping Information</span>
    </h4>
    <form (ngSubmit)="placeOrder()">
      <div class="mb-3">
        <label for="address" class="form-label">Address</label>
        <input
          type="text"
          class="form-control"
          id="address"
          [(ngModel)]="shippingAddress.address"
          name="address"
          required
        />
      </div>
      <div class="mb-3">
        <label for="city" class="form-label">City</label>
        <input
          type="text"
          class="form-control"
          id="city"
          [(ngModel)]="shippingAddress.city"
          name="city"
          required
        />
      </div>
      <div class="mb-3">
        <label for="postalCode" class="form-label">Postal Code</label>
        <input
          type="text"
          class="form-control"
          id="postalCode"
          [(ngModel)]="shippingAddress.postalCode"
          name="postalCode"
          required
        />
      </div>
      <div class="mb-3">
        <label for="country" class="form-label">Country</label>
        <input
          type="text"
          class="form-control"
          id="country"
          [(ngModel)]="shippingAddress.country"
          name="country"
          required
        />
      </div>
      <button type="submit" class="btn btn-primary w-100">
        Place Order
      </button>
    </form>
  </div>
