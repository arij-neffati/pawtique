<section class="signup" style="background: url('../assets/images/background-img.png') no-repeat;">
    <div class="container">
        <div class="signup-content">
            <div class="signup-form">
                <h2 class="form-title">Sign up</h2>
                <form (ngSubmit)="onSubmit($event)" class="register-form" id="register-form">
                    <div class="form-group">
                        <label for="name"><i class="material-icons">account_circle</i></label>
                        <input 
                            type="text" 
                            name="name" 
                            id="name" 
                            [(ngModel)]="name"
                            placeholder="Your Name"
                            required/>
                    </div>
                    <div class="form-group">
                        <label for="email"><i class="material-icons">email</i></label>
                        <input 
                            type="email" 
                            name="email" 
                            id="email" 
                            [(ngModel)]="email"
                            placeholder="Your Email"
                            required/>
                    </div>
                    <div class="form-group">
                        <label for="pass"><i class="material-icons">lock</i></label>
                        <input 
                            type="password" 
                            name="pass" 
                            id="pass" 
                            [(ngModel)]="password"
                            placeholder="Password"
                            required/>
                    </div>
                    <div class="form-group">
                        <label for="re-pass"><i class="material-icons">lock_outline</i></label>
                        <input 
                            type="password" 
                            name="re_pass" 
                            id="re_pass" 
                            [(ngModel)]="confirmPassword"
                            placeholder="Repeat your password"
                            required/>
                    </div>
                    <div class="form-group">
                        <input 
                            type="checkbox" 
                            name="agree-term" 
                            id="agree-term" 
                            [(ngModel)]="agreeTerms"
                            class="agree-term" 
                            required/>
                        <label for="agree-term" class="label-agree-term">
                            <span><span></span></span>I agree all statements in 
                            <a href="#" class="term-service">Terms of service</a>
                        </label>
                    </div>
                    <div *ngIf="errorMessage" class="error-message" style="color: red; margin-bottom: 10px;">
                        {{ errorMessage }}
                    </div>
                    <div class="form-group form-button">
                        <input type="submit" name="signup" id="signup" class="form-submit" value="Register"/>
                    </div>
                </form>
            </div>
            <div class="signup-image">
                <figure><img src="../../../assets/images/signin.png" alt="sign up image"></figure>
                <a (click)="navigateToSignIn()" class="signup-image-link">I am already member</a>
            </div>
        </div>
    </div>
</section>
