<section id="register" style="background: url('../assets/images/background-img.png') no-repeat;">
  <div class="container">
    <div class="row my-5 py-5">
      <div class="offset-md-3 col-md-6 my-5">
        <h2 class="display-3 fw-normal text-center">Found a stray?</h2>
        <h1 class="text-center"><span class="text-primary">Fill in the form below, and we will contact you soon</span></h1>
        <form (ngSubmit)="onSubmit()" #strayForm="ngForm">
          <div class="mb-3">
            <input type="text" class="form-control form-control-lg" [(ngModel)]="name" name="name" id="name" placeholder="Enter Your Name" required />
          </div>
          <div class="mb-3">
            <input type="text" class="form-control form-control-lg" [(ngModel)]="Lname" name="Lname" id="Lname" placeholder="Enter Your Last Name" required />
          </div>
          <div class="mb-3">
            <input type="email" class="form-control form-control-lg" [(ngModel)]="email" name="email" id="email" placeholder="Enter Your Email Address" required />
          </div>
          <div class="mb-3">
            <input type="text" class="form-control form-control-lg" [(ngModel)]="number" name="number" id="number" placeholder="Enter your phone number" required />
          </div>
          <div class="mb-3">
            <input type="text" class="form-control form-control-lg" [(ngModel)]="address" name="address" id="address" placeholder="Address" required />
          </div>
          <div class="d-grid gap-2">
            <button type="submit" class="btn btn-dark btn-lg rounded-1" [disabled]="!strayForm.valid">Confirm</button>
          </div>
        </form>
      </div>
    </div>
  </div>
</section>
