<section id="foodies" class="my-5">
  <div class="container my-5 py-5">
    <div class="section-header d-md-flex justify-content-between align-items-center">
      <h2 class="display-3 fw-normal">Pet Foodies</h2>
      <div class="mb-4 mb-md-0">
        <p class="m-0">
          <button class="filter-button me-4" (click)="filterProducts('')">ALL</button>
          <button class="filter-button me-4" (click)="filterProducts('cat')">CAT</button>
          <button class="filter-button me-4" (click)="filterProducts('dog')">DOG</button>
          <button class="filter-button me-4" (click)="filterProducts('bird')">BIRD</button>
        </p>
      </div>
      <div>
        <a routerLink="/shop" class="btn btn-outline-dark btn-lg text-uppercase fs-6 rounded-1">
          Shop Now
          <svg width="24" height="24" viewBox="0 0 24 24" class="mb-1">
            <use xlink:href="#arrow-right"></use>
          </svg>
        </a>
      </div>
    </div>

    <div class="isotope-container row">
      <div *ngFor="let product of filteredProducts" class="item {{product.type}} col-md-4 col-lg-3 my-4">
        <div *ngIf="product.status" class="z-1 position-absolute rounded-3 m-3 px-3 border border-dark-subtle">
          {{ product.status }}
        </div>
        <div class="card position-relative">
          <a [routerLink]="'/product/' + product._id">
            <img [src]="product.image" class="img-fluid rounded-4" [alt]="product.name" />
          </a>
          <div class="card-body p-0">
            <a [routerLink]="'/product/' + product._id">
              <h3 class="card-title pt-4 m-0">{{ product.name }}</h3>
            </a>

            <div class="card-text">
              <span class="rating secondary-font">
                <iconify-icon icon="clarity:star-solid" class="text-primary"></iconify-icon>
                <iconify-icon icon="clarity:star-solid" class="text-primary"></iconify-icon>
                <iconify-icon icon="clarity:star-solid" class="text-primary"></iconify-icon>
                <iconify-icon icon="clarity:star-solid" class="text-primary"></iconify-icon>
                <iconify-icon icon="clarity:star-solid" class="text-primary"></iconify-icon>
                {{ product.rating }}
              </span>

              <h3 class="secondary-font text-primary">{{ product.price }} DT</h3>

              <div class="d-flex flex-wrap mt-3">
                <button class="btn-cart me-3 px-4 pt-3 pb-3" (click)="addToCart(product)">
                  <h5 class="text-uppercase m-0">Add to Cart</h5>
                </button>
                <button class="btn-wishlist px-4 pt-3" (click)="addToWishlist(product)">
                  <iconify-icon icon="fluent:heart-28-filled" class="fs-5"></iconify-icon>
                </button>
              </div>
            </div>
          </div>
        </div>
      </div>
    </div>
  </div>
</section>
