<div class="container py-5">
  <h4 class="d-flex justify-content-between align-items-center mb-3">
    <span class="text-primary">Your Wishlist</span>
    <span class="badge bg-primary rounded-circle pt-2">{{ wishlistItems.length }}</span>
  </h4>
  <ul class="list-group mb-3">
    <li
      *ngFor="let item of wishlistItems"
      class="list-group-item d-flex justify-content-between lh-sm"
    >
      <div>
        <h6 class="my-0">{{ item.name }}</h6>
        <small class="text-body-secondary">{{ item.description }}</small>
      </div>
      <div class="text-end">
        <span class="text-body-secondary d-block">{{ item.price }} DT</span>
        <button
          class="btn btn-success btn-sm mt-2 me-2"
          (click)="moveToCart(item)"
        >
          Move to Cart
        </button>
        <button
          class="btn btn-danger btn-sm mt-2"
          (click)="removeFromWishlist(item._id)"
        >
          Remove
        </button>
      </div>
    </li>
  </ul>
</div>
